# Test discs for the load checks (tests/qdup-cd-retry.toml, qdup-cd-fail.toml, x360-cd-fail.toml): the layer built with its
# CD fault hook (PSYQ_TEST_CD_FAULT=1, psyq/src/cd.rs CdTestFault, in its own library build/psyq-tcd) and the game arming
# it. QD Up arms it after PLEASE WAIT, so the first read of the game's loads waits 300 vblanks (6 s) and then fails one
# try (t-cdretry: the layer re-syncs the drive, the next try reads it and the game is played) or every try (t-cdfail: the
# screen naming the file). 360X arms it before its second InitialiseFiles (the index of 360X.DAT, every try fails).
[[build]]
name = "t-cdretry"
out = "build/t-cdretry"
commands = [["qdup/disc.sh"]]
env = { PSOXIDE_REPO = "{input:sdk}", PSOXIDE_SRC = "{input:sdk}", QDUP_OUT = "build/t-cdretry", PSYQ_TEST_CD_FAULT = "1", QDUP_CFLAGS = "-DQDUP_TEST_CD_FAULT=1 -DQDUP_TEST_CD_DELAY=300" }
disc = "qdup.cue"
map = "qdup.map"

[[build]]
name = "t-cdfail"
out = "build/t-cdfail"
commands = [["qdup/disc.sh"]]
env = { PSOXIDE_REPO = "{input:sdk}", PSOXIDE_SRC = "{input:sdk}", QDUP_OUT = "build/t-cdfail", PSYQ_TEST_CD_FAULT = "1", QDUP_CFLAGS = "-DQDUP_TEST_CD_FAULT=99 -DQDUP_TEST_CD_DELAY=0" }
disc = "qdup.cue"
map = "qdup.map"

[[build]]
name = "t-x360cdfail"
out = "build/t-x360cdfail"
commands = [["360x/disc.sh"]]
env = { PSOXIDE_REPO = "{input:sdk}", PSOXIDE_SRC = "{input:sdk}", X360_OUT = "build/t-x360cdfail", PSYQ_TEST_CD_FAULT = "1", X360_CFLAGS = "-DX360_TEST_CD_FAULT=99 -DX360_TEST_CD_DELAY=0" }
disc = "360x.cue"
map = "360x.map"

[[size]]
build = "x360"

[[size]]
build = "qdup"

# Poll-bound tapes (the frontend's --press route, the smoke's presses, transcribed to PXITAPE2 with
# --input-tape-transcribe): 360X in Mission 1 with Cross held, QD Up after the first table loads (cue left and
# right, the strike). Windows are in the game's own pad polls.
[[speed]]
name = "x360-mission"
build = "x360"
tape = "pgo/x360-boot-thrust.pxtape"
polls = [2850, 3400]
offsets = [-24, -12, 0, 12, 24, 36]
launch_args = ["--digital-pad"]

[[speed]]
name = "qdup-shot"
build = "qdup"
tape = "pgo/qdup-shot.pxtape"
polls = [3000, 3800]
offsets = [-24, -12, 0, 12, 24, 36]
launch_args = ["--digital-pad"]

[journeys]
files = "tests/*.toml"
# The analog start-heading journey forces a DualShock in analog mode: the owner plays that way, and the layer hands such a pad to the
# game as a digital pad (docs/DECISIONS.md, "The pad works in digital and in analog mode"); the journey proves the thrust path through it.
forced_analog = { "x360-start-heading-analog" = "the owner plays in analog mode; the start heading must work through the layer's analog-to-digital path" }
# hw stays off: the hardware renderer matrix (--strict) refuses these games ("screen-offset display (hardware renderer defers to the CPU frame)" on the 360X and option screens, unclassified HW pixels in the QD Up 3D table); no old gate ran them that way.
precheck = ["smoke-x360", "smoke-qdup"]

[cross]
smoke = ["tests/smoke-x360.toml", "tests/smoke-qdup.toml"]

# Gameplay scripts (shell and python on the shared emulator build): one host check each, on the real model
# and on mister; 360X and QD Up again on mister,gpu-irq=never.
# Every check is in the one exclusive group "emu": the harness runs host checks in parallel, and these share a
# script's output directory across its models (build/gameplay/<name>) and start emulators of their own.
# Each gameplay check is keyed on what it reads (`inputs`, `uses`, and its build's bytes): the script, the
# python drivers, the game and layer sources, the SDK's guest sources and the frontend. psyq/build.sh is left
# out on purpose: it names the SDK pin, and a pin to another commit with the same guest tree changes nothing
# a script sees (any other change to it changes the build bytes, which the key holds). The five checks that
# also play other builds (craft, pod, pickup, tele, weapons) read their variant flags from this file. Each
# holds one machine emulator slot while it runs (`emulators`).

[[host]]
name = "x360"
build = "x360"
command = ["zsh", "tests/gameplay/x360.sh", "{out}", "build/gameplay/x360"]
models = ["real", "mister", "mister,gpu-irq=never"]
exclusive = "emu"
inputs = ["tests/gameplay/", "tools/", "360x/", "qdup/", "psoxide-c/", "escher/", "psyq/include/", "psyq/src/", "psyq/.cargo", "psyq/Cargo.lock", "psyq/Cargo.toml", "psyq/check-boot.sh", "psyq/hazard.sh", "psyq/lld.sh", "psyq/psyq-boot.ld", "psyq/psyq.ld", "psyq/rust-toolchain.toml", "psyq/stamp.sh"]
uses = ["sdk", "frontend"]
emulators = 1

[[host]]
name = "qdup"
build = "qdup"
command = ["zsh", "tests/gameplay/qdup.sh", "{out}", "build/gameplay/qdup"]
models = ["real", "mister", "mister,gpu-irq=never"]
exclusive = "emu"
inputs = ["tests/gameplay/", "tools/", "360x/", "qdup/", "psoxide-c/", "escher/", "psyq/include/", "psyq/src/", "psyq/.cargo", "psyq/Cargo.lock", "psyq/Cargo.toml", "psyq/check-boot.sh", "psyq/hazard.sh", "psyq/lld.sh", "psyq/psyq-boot.ld", "psyq/psyq.ld", "psyq/rust-toolchain.toml", "psyq/stamp.sh"]
uses = ["sdk", "frontend"]
emulators = 1

