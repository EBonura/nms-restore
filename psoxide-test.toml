# One clean-clone proof per program: a fresh clone of the pushed commit rebuilds each disc and its executable byte for byte.
[[clean]]
build = "x360"
compare = ["360x.bin", "360x.cue", "360x.exe"]

[[clean]]
build = "qdup"
compare = ["qdup.bin", "qdup.cue", "qdup.exe"]

[[install]]
build = "x360"
name = "360X (nms-restore)"

[[install]]
build = "qdup"
name = "QD Up (nms-restore)"

# QD Up's option screen draws both of its fields (GFX.C display_screen): the gate's frames of the title, the menu after three
# changes, the 2D or 3D choice and PLEASE WAIT.
[[host]]
name = "qdup-fields"
build = "qdup"
command = ["zsh", "tests/gameplay/qdup-fields.sh", "{out}", "build/gameplay/fields", "{tool:gate}"]
models = ["real", "mister", "mister,gpu-irq=never"]
exclusive = "emu"
emulators = 1

# QD Up's disc build carries none of NMS's debug status text (GFX.C QDUP_DEBUG_TEXT): a check of the executable's bytes.
[[host]]
name = "qdup-nodebug"
build = "qdup"
command = ["zsh", "tests/gameplay/qdup-nodebug.sh", "{out}"]
