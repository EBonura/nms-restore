# 360X and QD Up: the test description for psoxide-test (the SDK's harness, tools/psoxide-test).
# Two C programs on a Psy-Q compatibility layer in one repository. The harness declares what to build and
# check; the shell and python gameplay scripts stay what they are (a [[host]] check each, exit code decides),
# and the gate journeys are the title-to-play smokes plus the CD conformance rules on the real, mister and
# mister,gpu-irq=never models. Baseline: psoxide-test.baseline.toml.
# The SDK checkout the layer pins comes from the machine-local config ([inputs] sdk).
schema = 1
name = "360X and QD Up"
repository = "EBonura/nms-restore"

# The SDK pin is written in the layer's build script (the hex after PSOXIDE_REV:- in psyq/build.sh).
[sdk]
file = "psyq/build.sh"
after = "PSOXIDE_REV:-"

# 360X's disc and QD Up's disc: two programs, two builds (they share the layer build and the SDK clone, so they
# run in this order). The gameplay scripts take a build's output directory ({out}).
[[build]]
name = "x360"
out = "build/360x-cd"
commands = [["360x/disc.sh"]]
env = { PSOXIDE_REPO = "{input:sdk}", PSOXIDE_SRC = "{input:sdk}" }
disc = "360x.cue"
map = "360x.map"

[[build]]
name = "qdup"
out = "build/qdup-cd"
commands = [["qdup/disc.sh"]]
env = { PSOXIDE_REPO = "{input:sdk}", PSOXIDE_SRC = "{input:sdk}" }
disc = "qdup.cue"
map = "qdup.map"

# Test disc for tests/gameplay/ (a build of 360X with -D flags that place the situation the script checks).
[[build]]
name = "t-laser"
out = "build/t-laser"
commands = [["360x/disc.sh"]]
env = { PSOXIDE_REPO = "{input:sdk}", PSOXIDE_SRC = "{input:sdk}", X360_OUT = "build/t-laser", X360_CFLAGS = "-DX360_TEST_WARP=100 -DX360_TEST_WARP_EVERY=900 -DX360_TEST_WARP_HOLD=700 -DX360_TEST_WARP_NAMES=109 -DX360_TEST_WARP_DX=26 -DX360_TEST_WARP_DY=0" }
