# QD Up: control hints in play (owner's decision 2026-11-18, new/hints.c), in the debug font at the top where NMS's status
# lines were. They go with NMS's label (foul_occured) and the button held (event_flag): aim once the table is up, strike
# while Cross is held, how to strike under the SHOOT MODE label once Cross is let go, and the same in the 2D view. Each
# checkpoint reads the label and the set drawn (hint_mode).
# Reaching the table follows smoke-qdup.toml.
name = "qdup-help"
title = "QD Up: control hints in play, per mode"
disc = "build/qdup-cd/qdup.cue"
symbols = "build/qdup-cd/qdup.map"
pad = "digital"

# The program has started (psx-rt's __psx_rt_started reads "run_"): before that a .bss symbol reads the bytes the
# scene-core EXE stores there. The SDK's rule for journeys until psoxide-gate applies it itself (EMU-GATE-STARTED-RULE).
[[step]]
label = "the program has started"
wait_until = { kind = "ram", sym = "__psx_rt_started", size = 4, op = "eq", value = 0x5F6E7572 }
timeout = 600

[[step]]
label = "the option screen is up with START under the cursor"
wait_until = { kind = "ram", sym = "cursor", size = 4, op = "eq", value = 4 }
timeout = 2500

[[step]]
checkpoint = "options"
golden = false
[[step.assert]]
kind = "ram"
sym = "cursor"
size = 4
op = "eq"
value = 4
[[step.assert]]
kind = "ram"
sym = "cue_angle"
size = 4
op = "eq"
value = 0

[[step]]
label = "Start (the game clock reaches 1000: the screens publish no word of their own)"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1000 }
timeout = 4000

[[step]]
label = "Start leaves the title for the option screen"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1010 }
timeout = 300

[[step]]
label = "Up"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1140 }
timeout = 4000

[[step]]
label = "Up moves the cursor"
press = ["up"]
hold_until = { kind = "ram", sym = "cursor", size = 4, op = "eq", value = 3 }
timeout = 600

[[step]]
label = "Down"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1450 }
timeout = 4000

[[step]]
label = "Down moves it back to START"
press = ["down"]
hold_until = { kind = "ram", sym = "cursor", size = 4, op = "eq", value = 4 }
timeout = 600

[[step]]
label = "Cross on START opens the view choice screen"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1750 }
timeout = 4000

[[step]]
label = "Cross on START"
press = ["cross"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1760 }
timeout = 300

[[step]]
label = "Cross confirms the first entry, 3D"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1950 }
timeout = 4000

[[step]]
label = "Cross confirms 3D"
press = ["cross"]
hold_until = { kind = "ram", sym = "cue_angle", size = 4, op = "ne", value = 0 }
timeout = 2500

[[step]]
checkpoint = "game"
golden = false
[[step.assert]]
kind = "ram"
sym = "cue_angle"
size = 4
op = "ne"
value = 0
[[step.assert]]
kind = "ram"
sym = "view_3d"
size = 4
op = "eq"
value = 1

[[step]]
label = "the hints have been drawn for 30 frames"
wait_until = { kind = "ram", sym = "hint_frames", size = 4, op = "ge", value = 30 }
timeout = 600

[[step]]
checkpoint = "hints-aim"
golden = false
[[step.assert]]
kind = "ram"
sym = "foul_occured"
size = 2
op = "eq"
value = 36
note = "NMS's label: AIM MODE"
[[step.assert]]
kind = "ram"
sym = "hint_mode"
size = 4
op = "eq"
value = 1
note = "the aim set"
[[step.assert]]
kind = "ram"
sym = "event_flag"
size = 4
op = "ne"
value = 5
note = "not shoot mode yet"

[[step]]
label = "Cross held: shoot mode"
press = ["cross"]
hold_until = { kind = "ram", sym = "hint_frames", size = 4, op = "ge", value = 60 }
timeout = 600

[[step]]
checkpoint = "hints-shoot"
golden = false
[[step.assert]]
kind = "ram"
sym = "foul_occured"
size = 2
op = "eq"
value = 35
note = "NMS's label: SHOOT MODE"
[[step.assert]]
kind = "ram"
sym = "hint_mode"
size = 4
op = "eq"
value = 2
note = "the strike set: Cross held"
[[step.assert]]
kind = "ram"
sym = "event_flag"
size = 4
op = "eq"
value = 5
note = "TAKING_SHOT: the shoot-mode hints"

[[step]]
label = "the game has read the pad released"
wait_until = { kind = "ram", sym = "PadDataIn", size = 4, op = "eq", value = 0 }
timeout = 300

[[step]]
label = "the hints are drawn again with Cross let go"
wait_until = { kind = "ram", sym = "hint_frames", size = 4, op = "ge", value = 75 }
timeout = 600

[[step]]
checkpoint = "hints-shoot-let-go"
golden = false
[[step.assert]]
kind = "ram"
sym = "foul_occured"
size = 2
op = "eq"
value = 35
note = "NMS's label stays SHOOT MODE (GAME.C 416; only the shot's end resets it)"
[[step.assert]]
kind = "ram"
sym = "event_flag"
size = 4
op = "ne"
value = 5
note = "Cross is let go"
[[step.assert]]
kind = "ram"
sym = "hint_mode"
size = 4
op = "eq"
value = 3
note = "the set that goes with the SHOOT MODE label and Cross let go"

[[step]]
label = "L2 and R2 together: the 2D view"
press = ["l2", "r2"]
hold_until = { kind = "ram", sym = "view_3d", size = 4, op = "eq", value = 0 }
timeout = 300

[[step]]
label = "the hints are drawn in the 2D view"
wait_until = { kind = "ram", sym = "hint_frames", size = 4, op = "ge", value = 110 }
timeout = 600

[[step]]
checkpoint = "hints-2d"
golden = false
[[step.assert]]
kind = "ram"
sym = "hint_mode"
size = 4
op = "eq"
value = 3
note = "the label is still SHOOT MODE: the same set in 2D"
[[step.assert]]
kind = "ram"
sym = "view_3d"
size = 4
op = "eq"
value = 0
