# QD Up's option screen shows two chevrons around the value of every row that Left and Right change (owner's decision
# 2026-11-20, new/viewchoice.c): the balls, table, players and baize rows; the options, start, speaker, pad, card and
# trophy rows have none. The second page no longer says CIRCLE GOES BACK, and Circle still goes back. The route walks
# the first page up from START, steps every value of each adjustable row (two checkpoints one field apart for each, for
# tests/gameplay/qdup-options.sh), then the second page's baize colours; every wait is on a game variable.
name = "qdup-options"
title = "QD Up option screen: chevrons on the adjustable rows, no CIRCLE GOES BACK, Circle still goes back"
disc = "build/qdup-cd/qdup.cue"
symbols = "build/qdup-cd/qdup.map"
pad = "digital"

# The program has started (psx-rt's __psx_rt_started reads "run_"): before that a .bss symbol reads the bytes the
# scene-core EXE stores there. The SDK's rule for journeys until psoxide-gate applies it itself (EMU-GATE-STARTED-RULE).
[[step]]
label = "the program has started"
wait_until = { kind = "ram", sym = "__psx_rt_started", size = 4, op = "eq", value = 0x5F6E7572 }
timeout = 600

[[step]]
label = "the game clock reaches 1000"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1000 }
timeout = 4000

[[step]]
label = "Start leaves the title for the option screen"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 1010 }
timeout = 300

[[step]]
label = "the option screen is up with START under the cursor"
wait_until = { kind = "ram", sym = "caption_cursor", size = 4, op = "eq", value = 4 }
timeout = 4000

[[step]]
label = "the caption follows the cursor (start)"
wait_until = { kind = "ram", sym = "caption_cursor", size = 4, op = "eq", value = 4 }
timeout = 600

[[step]]
label = "settle: the caption has been drawn four times for these values, on both pages"
wait_until = { kind = "ram", sym = "caption_draws", size = 4, op = "ge", value = 4 }
timeout = 600

[[step]]
checkpoint = "start-0"
golden = false

[[step]]
label = "one field later: the next pass"
wait_until = { kind = "ram", sym = "caption_draws", size = 4, op = "ge", value = 5 }
timeout = 600

[[step]]
checkpoint = "start-1"
golden = false
[[step.assert]]
kind = "ram"
sym = "caption_chevrons"
size = 4
op = "eq"
value = 0
note = "the caption has 0 chevron bars"

[[step]]
label = "Up: OPTIONS"
press = ["up"]
hold_until = { kind = "ram", sym = "cursor", size = 4, op = "eq", value = 3 }
timeout = 600

[[step]]
label = "the game has read the pad released"
wait_until = { kind = "ram", sym = "PadDataIn", size = 4, op = "eq", value = 0 }
