# 360X, Mission 1: the craft starts pointing up and thrusts up (the Saturn's start heading, CONTROL.C Reset_Craft), digital pad.
# Mission 1 starts at 780,874 since 2026-11-21 (docs/DECISIONS.md, the starts). Before the heading fix the drawn frame was 0 (up) while thrust pushed right ((angle+16)&63 = 16) into the funnel's wall: the craft
# shook between x 350 and 353 and never climbed.  The boot is smoke-x360.toml's route.
name = "x360-start-heading"
title = "360X: start heading up, thrust climbs"
disc = "build/360x-cd/360x.cue"
symbols = "build/360x-cd/360x.map"
pad = "digital"

# Boot: tests/smoke-x360.toml's closed-loop route to Mission 1.
[[step]]
label = "the film plays and the title loop runs"
wait_until = { kind = "ram", sym = "gamecycle", size = 4, op = "ge", value = 100 }
timeout = 3000

[[step]]
checkpoint = "title"
golden = false
[[step.assert]]
kind = "ram"
sym = "gamecycle"
size = 4
op = "ge"
value = 100
[[step.assert]]
kind = "ram"
sym = "craftremaining"
size = 2
op = "eq"
value = 0

[[step]]
label = "Start at the title screen (selectno INTOTITLE, 241)"
press = ["start"]
hold_until = { kind = "ram", sym = "selectno", size = 1, op = "eq", value = 241 }
timeout = 600

[[step]]
label = "the screen changes (gamecycle restarts)"
wait_until = { kind = "ram", sym = "gamecycle", size = 4, op = "lt", value = 40 }
timeout = 600

[[step]]
label = "the next screen has run for a while (gamecycle restarts on every screen)"
wait_until = { kind = "ram", sym = "gamecycle", size = 4, op = "ge", value = 60 }
timeout = 600

[[step]]
label = "Start again leaves the title for the game (selectno INTOGAME, 240)"
press = ["start"]
hold_until = { kind = "ram", sym = "selectno", size = 1, op = "eq", value = 240 }
timeout = 600

[[step]]
label = "the screen changes (gamecycle restarts)"
wait_until = { kind = "ram", sym = "gamecycle", size = 4, op = "lt", value = 40 }
timeout = 600

[[step]]
label = "the next screen has run for a while (gamecycle restarts on every screen)"
wait_until = { kind = "ram", sym = "gamecycle", size = 4, op = "ge", value = 60 }
timeout = 600

[[step]]
press = ["start"]
hold_until = { kind = "ram", sym = "craftremaining", size = 2, op = "eq", value = 5 }
timeout = 900

[[step]]
checkpoint = "new-game"
golden = false
[[step.assert]]
kind = "ram"
sym = "craftremaining"
size = 2
op = "eq"
value = 5

[[step]]
label = "the option and planet screens publish no clock: wait for the game clock to reach 2050"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2050 }
timeout = 4000

[[step]]
label = "Start"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2060 }
timeout = 300

[[step]]
label = "the option and planet screens publish no clock: wait for the game clock to reach 2250"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2250 }
timeout = 4000

[[step]]
label = "Start"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2260 }
timeout = 300

[[step]]
label = "the option and planet screens publish no clock: wait for the game clock to reach 2450"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2450 }
timeout = 4000

[[step]]
label = "Start"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2460 }
timeout = 300

[[step]]
label = "the option and planet screens publish no clock: wait for the game clock to reach 2650"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2650 }
timeout = 4000

[[step]]
label = "Start"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2660 }
timeout = 300

[[step]]
label = "the option and planet screens publish no clock: wait for the game clock to reach 2850"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2850 }
timeout = 4000

[[step]]
label = "Start"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 2860 }
timeout = 300

[[step]]
label = "the option and planet screens publish no clock: wait for the game clock to reach 3050"
wait_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 3050 }
timeout = 4000

[[step]]
label = "Start"
press = ["start"]
hold_until = { kind = "ram", sym = "__psx_rt_vblank_count", size = 4, op = "ge", value = 3060 }
timeout = 300

[[step]]
label = "Mission 1 loads and starts (Init_Level sets the fuel)"
wait_until = { kind = "ram", sym = "fuel", size = 2, op = "gt", value = 0 }
timeout = 2500

[[step]]
label = "the mission runs"
wait_until = { kind = "ram", sym = "gamecycle", size = 4, op = "ge", value = 40 }
timeout = 600

[[step]]
checkpoint = "start"
golden = false
[[step.assert]]
kind = "ram"
sym = "angle"
size = 4
op = "eq"
value = 48
note = "thrust heading up: (48+16)&63 = 0"
[[step.assert]]
kind = "ram"
sym = "craftn"
size = 4
op = "eq"
value = 0
note = "drawn frame 0, up"
[[step.assert]]
kind = "ram"
sym = "pause"
size = 1
op = "eq"
value = 0

[[step]]
label = "Cross thrusts: the craft climbs 10 pixels"
press = ["cross"]
hold_until = { kind = "ram", sym = "crafty", size = 4, op = "lt", value = 864 }
timeout = 150

[[step]]
checkpoint = "climbed"
golden = false
[[step.assert]]
kind = "ram"
sym = "crafty"
size = 4
op = "lt"
value = 864
[[step.assert]]
kind = "ram"
sym = "craftx"
size = 4
op = "ge"
value = 776
note = "straight up, not into a wall"
[[step.assert]]
kind = "ram"
sym = "craftx"
size = 4
op = "lt"
value = 785
